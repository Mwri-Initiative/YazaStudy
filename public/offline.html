<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="robots" content="noindex" />
    <title>You're offline — Yaza Study</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0a0a0b; color: #fff; }
      main { width: min(100%, 460px); text-align: center; padding: 32px 24px; border: 1px solid rgba(255,255,255,.1); border-radius: 28px; background: rgba(255,255,255,.04); box-shadow: 0 24px 70px rgba(0,0,0,.35); }
      img { width: 76px; height: 76px; border-radius: 20px; margin-bottom: 20px; }
      .badge { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; background: rgba(99,102,241,.14); color: #c7d2fe; font-size: 12px; font-weight: 700; margin-bottom: 14px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; }
      h1 { margin: 0 0 10px; font-size: clamp(25px, 7vw, 34px); letter-spacing: -.03em; }
      p { margin: 0 auto 22px; max-width: 360px; color: #cbd5e1; line-height: 1.65; font-size: 15px; }
      button { border: 0; border-radius: 14px; padding: 13px 20px; background: #6366f1; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      button:active { transform: translateY(1px); }
      small { display: block; margin-top: 16px; color: #64748b; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="Yaza Study" />
      <div class="badge"><span class="dot"></span> Offline mode</div>
      <h1>No internet connection</h1>
      <p>You're offline right now. Reconnect to the internet and try again. Pages you've already visited may still be available.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>Yaza Study • Learn • Practice • Excel</small>
    </main>
  </body>
</html>
